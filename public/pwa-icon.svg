<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gambia-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="gambia-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gambia-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Gambia Tri-color decorative accent band -->
  <g opacity="0.9" transform="translate(0, 30)">
    <rect x="76" y="40" width="360" height="12" rx="6" fill="#E11D48"/>
    <rect x="76" y="56" width="360" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="76" y="66" width="360" height="16" rx="6" fill="#2563EB"/>
    <rect x="76" y="86" width="360" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="76" y="96" width="360" height="12" rx="6" fill="#10B981"/>
  </g>

  <!-- Central Smartphone & "9" Badge -->
  <g transform="translate(256, 300)">
    <!-- Shield / Phone container -->
    <rect x="-140" y="-130" width="280" height="230" rx="36" fill="#1E293B" stroke="#38BDF8" stroke-width="6" opacity="0.95" filter="url(#glow)"/>
    
    <!-- Phone Top Notch -->
    <rect x="-40" y="-120" width="80" height="8" rx="4" fill="#64748B"/>
    
    <!-- Number 9 large badge -->
    <circle cx="-35" cy="-10" r="62" fill="url(#gambia-blue)"/>
    <text x="-35" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#FFFFFF" text-anchor="middle">9</text>

    <!-- Upward arrow / upgrade spark -->
    <circle cx="55" cy="-25" r="38" fill="url(#gambia-green)"/>
    <!-- Arrow pointing up-right -->
    <path d="M40 -12 L68 -40 M48 -40 L68 -40 L68 -20" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Contact dots/lines -->
    <rect x="30" y="24" width="70" height="10" rx="5" fill="#38BDF8"/>
    <rect x="30" y="44" width="45" height="8" rx="4" fill="#94A3B8"/>

    <!-- Bottom label -->
    <text x="0" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" letter-spacing="4" text-anchor="middle">PURA READY</text>
  </g>
</svg>
