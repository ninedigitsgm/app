<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Outer Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Inner Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Highlight Reflection -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Solid Background for Maskable Icon Safe Zone -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Gambian Flag Arc Accent in Top Corner -->
  <g opacity="0.85">
    <path d="M 0 0 L 160 0 C 140 60 100 110 0 160 Z" fill="#ce1126" opacity="0.25" />
    <path d="M 512 512 L 352 512 C 372 452 412 402 512 352 Z" fill="#3a7728" opacity="0.25" />
  </g>

  <!-- Central Circular Icon (Safe Area 80% Radius: center 256, radius 195) -->
  <g transform="translate(256, 256)">
    <!-- Outer Glow Ring -->
    <circle r="192" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.9" />
    <circle r="185" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />

    <!-- Main Emblem Circle -->
    <circle r="180" fill="url(#emblemGrad)" />

    <!-- Top Gloss Highlight -->
    <ellipse cx="0" cy="-65" rx="140" ry="85" fill="url(#shineGrad)" />

    <!-- 7 to 9 Graphic Transformation Shape -->
    <!-- 7 Shadow / Backdrop -->
    <path d="M -92 -45 L 8 -45 L 8 -10 L -42 90 L -82 90 L -30 -10 L -92 -10 Z" fill="#000000" opacity="0.25" transform="translate(3, 4)" />
    
    <!-- White Digit 7 -->
    <path d="M -92 -45 L 8 -45 L 8 -10 L -42 90 L -82 90 L -30 -10 L -92 -10 Z" fill="#ffffff" />

    <!-- Dynamic Transition Arrow Arc (7 to 9) -->
    <path d="M -85 -55 C -65 -95 15 -105 65 -65" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 0" />
    <polygon points="60,-75 75,-60 50,-55" fill="#ffffff" />
    
    <!-- Sparkles on Arrow -->
    <circle cx="-55" cy="-80" r="3.5" fill="#fef08a" />
    <circle cx="-25" cy="-90" r="2.5" fill="#ffffff" />
    <circle cx="15" cy="-85" r="3" fill="#fef08a" />

    <!-- Digit 9 Shadow -->
    <path d="M 68 -65 C 20 -65 -15 -25 -15 25 C -15 75 20 115 68 115 C 115 115 145 78 145 25 C 145 -25 115 -65 68 -65 Z M 68 -22 C 86 -22 98 -2 98 25 C 98 52 86 72 68 72 C 50 72 38 52 38 25 C 38 -2 50 -22 68 -22 Z" fill="#000000" opacity="0.25" transform="translate(3, 4)" />
    <path d="M 98 10 L 98 105 C 98 125 80 142 55 142 L 30 142 L 30 115 L 55 115 C 65 115 72 108 72 98 L 72 65 Z" fill="#000000" opacity="0.25" transform="translate(3, 4)" />

    <!-- White Digit 9 -->
    <!-- Loop -->
    <path d="M 68 -65 C 22 -65 -12 -28 -12 22 C -12 72 22 108 68 108 C 112 108 142 72 142 22 C 142 -28 112 -65 68 -65 Z M 68 -20 C 86 -20 96 -2 96 22 C 96 48 86 66 68 66 C 50 66 40 48 40 22 C 40 -2 50 -20 68 -20 Z" fill="#ffffff" />
    <!-- Stem/Tail -->
    <path d="M 96 15 L 96 95 C 96 118 78 135 52 135 L 25 135 L 25 106 L 50 106 C 62 106 70 98 70 88 L 70 45 Z" fill="#ffffff" />

    <!-- Inner 9 Gradient Glow Fill -->
    <ellipse cx="68" cy="22" rx="20" ry="32" fill="#059669" opacity="0.35" />

    <!-- Subtitle: "Digits" Banner Pill -->
    <g transform="translate(0, 115)">
      <rect x="-65" y="-12" width="130" height="26" rx="13" fill="#020617" opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">
        DIGITS
      </text>
    </g>
  </g>
</svg>
